name: Publish Python 🐍 distribution 📦 to PyPI on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv and build tools
        run: |
          pip install uv
          uv pip install --system build twine

      - name: Build package
        run: |
          python -m build

      - name: Verify bundled swagger.json shipped in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q "rootly_mcp_server/data/swagger.json" \
            || { echo "::error::swagger.json missing from wheel — the server would fetch it and write swagger.json into the host CWD on every launch (#153)"; exit 1; }

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* 
