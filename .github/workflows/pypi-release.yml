name: Publish Python 🐍 distribution 📦 to PyPI

# Releases are driven by the version in pyproject.toml. The workflow only runs
# when pyproject.toml changes on main (i.e. a version bump), on a manually
# pushed tag (kept for backwards compatibility), or via manual dispatch. It then
# checks whether the current version is already on PyPI and, only if not, builds,
# publishes, and creates the matching v<version> tag. This removes the manual
# "git tag && push" step that, when skipped, silently left new versions
# unpublished (PyPI stalled at 2.3.9 while the repo advanced to 2.3.16).

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: write # needed to create and push the release tag

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Validate manually pushed release tag
        if: github.ref_type == 'tag'
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "$PUSHED_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Pushed tag $PUSHED_TAG does not match pyproject.toml version tag $EXPECTED_TAG."
            exit 1
          fi

      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          URL="https://pypi.org/pypi/rootly-mcp-server/${{ steps.version.outputs.version }}/json"
          if ! HTTP_STATUS="$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "$URL")"; then
            echo "::error::Could not query PyPI for version availability."
            exit 1
          fi

          case "$HTTP_STATUS" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Version ${{ steps.version.outputs.version }} is already on PyPI — nothing to do."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "Version ${{ steps.version.outputs.version }} is not on PyPI — releasing."
              ;;
            *)
              echo "::error::PyPI returned unexpected HTTP status $HTTP_STATUS."
              exit 1
              ;;
          esac

      - name: Install build tools
        if: steps.pypi.outputs.published == 'false'
        run: |
          pip install uv
          uv pip install --system build twine

      - name: Build package
        if: steps.pypi.outputs.published == 'false'
        run: python -m build

      - name: Publish to PyPI
        if: steps.pypi.outputs.published == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create and push release tag
        if: steps.pypi.outputs.published == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on origin — skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG."
          fi
