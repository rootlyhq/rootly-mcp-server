name: Plugin Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: HOL Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          min_score: "80"
          fail_on_severity: high
          # v1.2.786+ ignores .plugin-scanner.toml unless the repo policy is
          # trusted. Trust it on main and same-repo PRs only, so a fork PR
          # cannot widen ignore_paths to hide a secret.
          trust_repository_policy: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
