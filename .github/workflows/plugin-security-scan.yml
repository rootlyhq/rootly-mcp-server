name: Plugin Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: HOL Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load reviewed scanner policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/hol-policy"
          gh api "repos/$GITHUB_REPOSITORY/contents/.plugin-scanner.toml?ref=$POLICY_REF" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$RUNNER_TEMP/hol-policy/scanner.toml"

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@6ed3f34b07bbd674da934c532cc7473ab6365d29 # v1.2.821
        with:
          plugin_dir: "."
          config: ${{ runner.temp }}/hol-policy/scanner.toml
          min_score: "80"
          fail_on_severity: high
          # Scan PR code using the policy from its immutable base commit.
          # PR changes cannot widen the reviewed exceptions. Pushes use
          # the policy from the exact commit being scanned.
          trust_repository_policy: "true"
